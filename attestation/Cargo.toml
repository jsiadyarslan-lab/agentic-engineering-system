[package]
name = "attestation"
version = "0.1.0"
edition = "2024"
description = "Substrate attestation and measurement for zero-trust"

[dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

# Crypto
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true, features = ["std"] }

# TPM/TPM2
# tss-esapi = { version = "0.5", features = ["integration"] }  # Not available on crates.io

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
