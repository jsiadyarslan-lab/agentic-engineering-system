[package]
name = "substrate-remote"
version = "0.1.0"
edition = "2024"
description = "Remote worker substrate for distributed execution"

[dependencies]
substrate-core = { path = "../substrate-core" }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

# Remote execution
tonic = { workspace = true, features = ["tls", "transport"] }
prost = { workspace = true, features = ["std"] }
prost-types = { workspace = true }
# tls-rustls = { version = "0.24", features = ["tokio"] }  # Using rustls directly via tonic

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }