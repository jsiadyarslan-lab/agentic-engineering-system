[package]
name = "substrate-linux"
version = "0.1.0"
edition = "2024"
description = "Linux substrate implementation using namespaces, seccomp, cgroups v2, and landlock"

[dependencies]
substrate-core = { path = "../substrate-core" }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

# Linux-specific
libc = { workspace = true }
nix = { workspace = true }
seccomp = { workspace = true }
seccompiler = { workspace = true }
caps = { version = "0.4", optional = true }
landlock = { version = "0.4", optional = true }

# Optional: for async file I/O (using std fs for now)
# tokio-fs = { version = "0.2", features = ["tokio-io"] }  # Not yet stable
# tokio-io = "1.0"  # Not yet stable

# For artifact collection
walkdir = "2"
sha2 = { workspace = true }
which = "6"

[features]
default = []
landlock = ["dep:landlock", "dep:caps"]

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }