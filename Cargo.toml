[workspace]
resolver = "2"
members = [
    "substrate-core",
    "substrate-linux",
    "substrate-windows",
    "substrate-macos",
    "substrate-docker",
    "substrate-remote",
    "job-objects",
    "silos",
    "seatbelt",
    "limits",
    "process",
    "artifacts",
    "network",
    "replay",
    "capability-negotiation",
    "attestation",
    "code-graph",
    "plugin-sdk",
    "plugin-api",
]

[workspace.dependencies]
# Core
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde", "v1"] }
bytes = "1.0"
parking_lot = "0.12"
dashmap = "5.0"

# Linux substrate
libc = "0.2.153"
nix = "0.28"
seccomp = "0.1"
seccompiler = "0.5"

# Windows substrate
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WindowsProgramming",
] }

# macOS substrate
objc = "0.2"
block = "0.1"

# Serialization
bincode = "1.3"
postcard = "1.0"

# Networking
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = { version = "0.12", features = ["std"] }
prost-types = "0.12"

# Crypto
sha2 = "0.10"
blake3 = "1.0"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
rand = { version = "0.8", features = ["std"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# WASM
wasmtime = { version = "25", features = ["cranelift", "async"] }
wasi = { version = "0.11" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "json", "chrono", "migrate"] }
rusqlite = { version = "0.31", features = ["bundled", "serde_json", "extra_check"] }

# Serialization
ron = "0.8"

# Testing
tempfile = "3.0"
proptest = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = 0

[build]
rustflags = ["-C", "target-cpu=native"]