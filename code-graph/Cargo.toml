[package]
name = "code-graph"
version = "0.1.0"
edition = "2024"
description = "Tree-sitter + LLVM IR based code graph with call graph, data flow, and type information"

[dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

# Tree-sitter
tree-sitter = { version = "0.23", features = ["std"] }
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

# LLVM
inkwell = { version = "0.1", features = ["llvm15-0"] }

# Graph
petgraph = "0.6"

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
