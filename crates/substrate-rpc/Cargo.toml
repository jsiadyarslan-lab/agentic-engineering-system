[package]
name = "substrate-rpc"
version = "0.1.0"
edition = "2021"
description = "gRPC server for substrate-linux"

[dependencies]
substrate-linux = { path = "../substrate-linux" }
substrate-core = { path = "../substrate-core" }
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
prost-types = "0.13"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }

[build-dependencies]
tonic-build = "0.12"

[build-dependencies]
prost = "0.13"

[features]
default = []