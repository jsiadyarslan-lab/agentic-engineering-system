[package]
name = "substrate-windows"
version = "0.1.0"
edition = "2024"
description = "Windows substrate implementation using Job Objects, Silos, and AppContainers"

[dependencies]
substrate-core = { path = "../substrate-core" }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"
sha2 = "0.10"
walkdir = "2"
which = "6"

# Windows-specific
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_SystemServices",
] }
job-objects = { path = "../job-objects" }
silos = { path = "../silos" }
limits = { path = "../limits" }

[build-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }