syntax = "proto3";

package substrate;

// ExecuteRequest represents a request to execute a command in the substrate
message ExecuteRequest {
  string sandbox_id = 1;
  string image = 2;
  repeated string command = 3;
  ExecutionLimits limits = 4;
  map<string, string> env = 2;
  NetworkMode network = 3;
  string workspace_root = 5;
  string artifacts_dir = 6;
}

// ExecuteResponse represents the result of an execution
message ExecuteResponse {
  string sandbox_id = 1;
  bool executed = 2;
  int32 exit_code = 3;
  Termination termination = 4;
  uint64 duration_ms = 5;
  string stdout = 2;
  string stderr = 3;
  ExecutionLimits limits_applied = 4;
  repeated ArtifactCustodyEntry artifacts = 5;
  double started_at = 6;
  double finished_at = 7;
}

// ExecuteStreamResponse for streaming logs
message ExecuteStreamResponse {
  LogEntry log = 1;
  ExecuteResponse final_response = 2;
}

// LogEntry represents a single log line with metadata
message LogEntry {
  string sandbox_id = 1;
  string stream = 2; // "stdout" or "stderr"
  string content = 3;
  double timestamp = 4;
}

// HealthStatus represents the health of the substrate
message HealthStatus {
  enum Status {
    HEALTHY = 0;
    BUSY = 1;
    UNHEALTHY = 2;
    UNAVAILABLE = 3;
  }
  Status status = 1;
  string message = 2;
  double timestamp = 1;
}

// HealthCheckRequest for health check
message HealthCheckRequest {}

// ExecutionLimits represents resource limits for sandbox execution
message ExecutionLimits {
  uint64 memory_bytes = 1;
  double cpu_percent = 2;
  uint64 cpu_time_seconds = 3;
  uint32 max_processes = 4;
  uint64 max_file_size = 5;
  uint32 max_open_files = 6;
  uint64 wall_time_seconds = 7;
  uint64 max_output_bytes = 8;
  uint64 max_artifact_bytes = 8;
  uint64 max_workspace_bytes = 9;
}

// NetworkMode represents network isolation modes
enum NetworkMode {
  NONE = 0;
  EGRESS = 1;
  INGRESS = 2;
  EGRESS_FILTERED = 3;
}

// Termination represents how a sandbox execution ended
enum Termination {
  COMPLETED = 0;
  FAILED = 1;
  TIMEOUT = 2;
  LIMIT_BREACH = 3;
  FAILED_TO_START = 4;
  NOT_RUN = 5;
}

// ArtifactCustodyEntry represents an artifact produced during execution
message ArtifactCustodyEntry {
  string path = 1;
  string sha256 = 2;
  uint64 size = 3;
  string kind = 4;
}

// HealthCheckResponse for health check
message HealthCheckResponse {
  HealthStatus status = 1;
}

// ExecuteStreamRequest for streaming execution
message ExecuteStreamRequest {
  ExecuteRequest request = 1;
}

// SubstrateService defines the gRPC service
service SubstrateService {
  // Execute a command in the substrate
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  
  // Execute with streaming logs
  rpc ExecuteStream(ExecuteStreamRequest) returns (stream ExecuteStreamResponse);
  
  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Capability negotiation
  rpc NegotiateCapability(CapabilityRequest) returns (CapabilityResponse);
}

// CapabilityRequest for capability negotiation
message CapabilityRequest {
  repeated string required = 1;
  repeated string preferred = 2;
  ExecutionLimits resource_limits = 3;
}

// CapabilityResponse for capability negotiation
message CapabilityResponse {
  repeated string granted = 1;
  repeated string denied = 2;
  ExecutionLimits adjusted_limits = 3;
  string substrate_type = 4;
}

// SubstrateDescriptor for substrate identification
message SubstrateDescriptor {
  string name = 1;
  string isolation_class = 2;
  string network_support = 3;
  string version = 4;
}

// SubstrateCapability represents the capabilities of a substrate
message SubstrateCapability {
  string name = 1;
  string isolation_class = 2;
  string network_support = 3;
  ResourceLimits resource_limits = 4;
  repeated string supported_profiles = 5;
  uint32 max_concurrent_sandboxes = 6;
}

// ResourceLimits represents the resource limits supported by a substrate
message ResourceLimits {
  uint64 max_memory_bytes = 1;
  double max_cpu_percent = 2;
  uint64 max_cpu_time_seconds = 3;
  uint32 max_processes = 4;
  uint64 max_file_size = 5;
  uint32 max_open_files = 6;
  uint64 max_wall_time_seconds = 7;
  uint64 max_output_bytes = 7;
  uint64 max_artifact_bytes = 8;
  uint64 max_workspace_bytes = 8;
}

// CapabilityRequest for negotiation
message CapabilityRequest {
  repeated string required = 1;
  repeated string preferred = 2;
  ExecutionLimits resource_limits = 3;
}

// CapabilityResponse for capability negotiation
message CapabilityResponse {
  repeated string granted = 1;
  repeated string denied = 2;
  ExecutionLimits adjusted_limits = 3;
  string substrate_type = 4;
}