// Rich text for saved assistant turns. Only literal templates emit HTML.
function replyInline(raw){
 const token=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\[\]\n]{1,512})\]\((https?:\/\/[^\s<>"'()]{1,2048})\)/g;
 let out='',end=0;
 for(const m of raw.matchAll(token)){
   out+=E(raw.slice(end,m.index));
   if(m[1])out+='<code dir="ltr">'+E(m[1])+'</code>';
   else if(m[2])out+='<strong>'+E(m[2])+'</strong>';
   else if(m[3])out+='<em>'+E(m[3])+'</em>';
   else out+='<a href="'+E(m[5])+'" target="_blank" rel="noopener noreferrer">'+E(m[4])+'</a>';
   end=m.index+m[0].length;
 }
 return out+E(raw.slice(end));
}
function replyMarkup(raw){
 const rows=String(raw??'').replace(/\r\n?/g,'\n').split('\n');
 const out=[],paragraph=[];
 const listRow=/^\s*(?:([-+*])|([0-9]+)[.)])\s+(.+)$/;
 const tableRow=/^\s*\|.*\|\s*$/;
 const tableRule=/^\s*\|(?:\s*:?-{3,}:?\s*\|)+\s*$/;
 const cells=s=>s.trim().slice(1,-1).split('|').map(c=>c.trim());
 const flush=()=>{if(paragraph.length)out.push('<p dir="auto">'+replyInline(paragraph.splice(0).join('\n'))+'</p>')};
 for(let i=0;i<rows.length;){
   const line=rows[i++];
   if(!line.trim()){flush();continue}
   const fence=line.match(/^\s*(`{3,})([\w+.-]*)\s*$/);
   const heading=line.match(/^\s*(#{1,6})\s+(.+)$/);
   const list=line.match(listRow);
   if(fence){
     flush();const code=[],closing=new RegExp('^\\s*`{'+fence[1].length+',}\\s*$');
     while(i<rows.length&&!closing.test(rows[i]))code.push(rows[i++]);
     if(i<rows.length)i++;
     out.push('<pre dir="ltr" tabindex="0" aria-label="مقطع كود"><code>'+E(code.join('\n'))+'</code></pre>');
   }else if(heading){
     flush();const level=Math.min(4,heading[1].length+1);
     out.push('<h'+level+' dir="auto">'+replyInline(heading[2])+'</h'+level+'>');
   }else if(/^\s*(?:---+|\*\*\*+)\s*$/.test(line)){
     flush();out.push('<hr>');
   }else if(list){
     flush();const numbered=Boolean(list[2]),tag=numbered?'ol':'ul',items=[list[3]];
     while(i<rows.length){
       const next=rows[i].match(listRow);
       if(!next||Boolean(next[2])!==numbered)break;
       items.push(next[3]);i++;
     }
     out.push('<'+tag+'>'+items.map(x=>'<li dir="auto">'+replyInline(x)+'</li>').join('')+'</'+tag+'>');
   }else if(tableRow.test(line)&&tableRule.test(rows[i]||'')&&cells(line).length===cells(rows[i]).length){
     flush();const head=cells(line),body=[];i++;
     while(tableRow.test(rows[i]||'')&&cells(rows[i]).length===head.length)body.push(cells(rows[i++]));
     out.push('<div class="aes-md-table" role="region" aria-label="جدول ضمن الرد" tabindex="0"><table><thead><tr>'+
       head.map(x=>'<th scope="col" dir="auto">'+replyInline(x)+'</th>').join('')+'</tr></thead><tbody>'+
       body.map(row=>'<tr>'+row.map(x=>'<td dir="auto">'+replyInline(x)+'</td>').join('')+'</tr>').join('')+
       '</tbody></table></div>');
   }else if(/^\s*>/.test(line)){
     flush();out.push('<blockquote dir="auto">'+replyInline(line.replace(/^\s*>\s?/,''))+'</blockquote>');
   }else paragraph.push(line);
 }
 flush();return out.join('');
}

document.addEventListener('input',e=>{const t=e.target;if(t?.name==='message'&&t.closest?.('#send-chat'))state.drafts[draftKey()]=t.value;});
document.addEventListener('submit',e=>{if(e.target.id==='create'){e.preventDefault();submitCreate(e.target)}if(e.target.id==='send-chat'){e.preventDefault();submitChat(e.target)}if(e.target.id==='artifact-filter-form'){e.preventDefault();state.artifactQuery=String(new FormData(e.target).get('q')||'').trim().slice(0,180);state.artifactLimit=30;state.preview=null;paint()}});
window.addEventListener('hashchange',()=>{state.side=false;state.conversationId=route().conversationId||null;loadAll()});
setInterval(()=>{if(document.hidden||state.busy||!route().id||state.loading)return;
 const editor=document.activeElement;if(editor?.matches?.('#send-chat textarea'))return;
 if(route().view!=='chat')refreshDetail()},30000);
setInterval(()=>{if(!document.hidden&&(state.serverChat!=='idle'||state.recoveringChat))followSavedReply();},4500);
if(!location.hash)history.replaceState(null,'','#/home');
document.documentElement.setAttribute('data-theme',state.theme);
state.conversationId=route().conversationId||null;
loadAll();
</script></body></html>
