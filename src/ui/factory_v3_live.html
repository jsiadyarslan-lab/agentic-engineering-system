async function req(path,opts={},timeout=12000){
  const a=new AbortController(),clock=setTimeout(()=>a.abort(),timeout);
  try{
    const r=await fetch(path,{credentials:'same-origin',cache:'no-store',signal:a.signal,...opts});
    const raw=await r.text();let body=null;
    try{body=raw?JSON.parse(raw):null}catch{body=raw}
    if(!r.ok)throw Error('HTTP '+r.status+' — '+(typeof body==='object'?body?.detail||r.statusText:raw.slice(0,180)));
    return body;
  }catch(e){throw Error(e.name==='AbortError'?'تجاوز الطلب مهلة '+(timeout/1000)+' ثانية':e.message)}

async function post(path,data){return req(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})},25000)}

     };
     while(true){const x=await reader.read();if(x.done)break;bytes+=x.value.byteLength;if(bytes>3000000)throw Error('حجم بث مفرط');buf+=decoder.decode(x.value,{stream:true}).replace(/\r\n/g,'\n');let k;while((k=buf.indexOf('\n\n'))!==-1){onFrame(buf.slice(0,k));buf=buf.slice(k+2)}}
     if(buf.trim())onFrame(buf);
     if(!finished&&!wasError)throw Error('انقطع البث دون تأكيد اكتمال');
   }finally{clearTimeout(timer)}
   if(cid){if(projectAtStart){try{await post('/api/conversations/'+cid+'/move-to-project',{project_id:projectAtStart})}catch(e){state.error='حُفظ الرد لكن فشل ربطه بالمشروع: '+e.message}}
    const stillOnOrigin=route().id===projectAtStart&&route().view==='chat'&&(state.conversationId||null)===conversationAtStart;
    if(stillOnOrigin){history.replaceState(null,'',url(projectAtStart,'chat')+'/'+cid);state.conversationId=cid;await loadExtra(state.revision);await loadMessages()}}
   else state.error='لم يعد معرف المحادثة';
   if(!wasError&&!state.error){if(route().id===projectAtStart&&route().view==='chat'&&(state.conversationId||null)===cid)state.status='حُفظ الرد على الخادم';delete state.drafts[originDraft]}
 }catch(e){state.error='فشل البث: '+e.message+'؛ افحص السجل قبل إعادة الإرسال.';if(cid&&route().id===projectAtStart&&route().view==='chat'&&(state.conversationId||null)===conversationAtStart){state.conversationId=cid;try{await loadExtra(state.revision);await loadMessages()}catch{}}}
 finally{state.busy=false;state.pendingProjectId=null;state.pendingConversationId=null;state.activeChatId=null;state.stopPending=false;state.pendingText='';if(!state.error)state.liveText='';paint()}
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();handle(a.dataset.action)}});
document.addEventListener('input',e=>{const t=e.target;if(t?.name==='message'&&t.closest?.('#send-chat'))state.drafts[draftKey()]=t.value;});
document.addEventListener('submit',e=>{if(e.target.id==='create'){e.preventDefault();submitCreate(e.target)}if(e.target.id==='send-chat'){e.preventDefault();submitChat(e.target)}if(e.target.id==='artifact-filter-form'){e.preventDefault();state.artifactQuery=String(new FormData(e.target).get('q')||'').trim().slice(0,180);state.artifactLimit=30;state.preview=null;paint()}});
window.addEventListener('hashchange',()=>{state.side=false;state.conversationId=route().conversationId||null;loadAll()});
setInterval(()=>{if(document.hidden||state.busy||!route().id||state.loading)return;
 const editor=document.activeElement;if(editor?.matches?.('#send-chat textarea'))return;
 refreshDetail()},30000);
if(!location.hash)history.replaceState(null,'','#/home');
document.documentElement.setAttribute('data-theme',state.theme);
state.conversationId=route().conversationId||null;
loadAll();
