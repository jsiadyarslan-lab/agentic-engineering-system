async function request(path,{body,plain=false,timeout=12000,stream=false}={}){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);
 try{
  const res=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{Accept:stream?'text/event-stream':plain?'text/plain':'application/json',...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});
  if(!res.ok){let j;try{j=await res.json()}catch{}throw Error(cleanError(j,'رفض الخادم الطلب ('+res.status+').'))}
  const ct=res.headers.get('content-type')||'';
  const need=stream?'text/event-stream':plain?'text/plain':'application/json';
  if(!ct.includes(need))throw Error('استجابة غير متوقعة من المصنع. تحقق من الاتصال أو تسجيل الدخول.');
  if(stream)return res;
  return plain?await res.text():await res.json();
 }catch(e){if(e.name==='AbortError')throw Error('انتهت مهلة الاتصال قبل اكتمال الرد.');throw e}
 finally{clearTimeout(timer)}
}

function readPart(p,k){

 const endpoints={state:'/state',runtime:'/runtime',steps:'/steps',artifacts:'/artifacts',history:'/history?limit=40',executions:'/executions',audit:'/audit'};
 s.inflight[k]=request(apiP(p)+endpoints[k]).then(o=>{s[k]=o;delete s.errors[k]}).catch(e=>{s.errors[k]=e.message}).finally(()=>{delete s.inflight[k];update()});return s.inflight[k]
}

function evidenceFields(payload){const x=stableObject(payload),out={};for(const k of ['reason','message','error','status','step_id','execution_id','attempt','from','to','verdict','kind','gate_id','approved'])if(['string','number','boolean'].includes(typeof x[k]))out[k]=typeof x[k]==='string'?x[k].slice(0,1600):x[k];return Object.keys(out).length?JSON.stringify(out,null,2):'لا تفاصيل موجزة لهذا الحدث.'}
function reasonOf(s){
 const failure=arr(s.steps?.steps).find(x=>['FAILED','BLOCKED','INTERRUPTED'].includes(x.status));
 const rt=s.runtime||{}, st=s.state||{}, fa=arr(st.events).slice().reverse().find(x=>['EXECUTION_FAILED','STEP_FAILED','JOB_INTERRUPTED','PLANNING_FAILED'].includes(x.kind));
 const lastExec=arr(s.executions?.executions||st.executions).find(x=>['FAILED','BLOCKED','INTERRUPTED'].includes(x.status));
 return {why:text(rt.blocking_reason)||text(rt.last_error)||text(st.last_error)||text(failure?.last_error)||text(lastExec?.error)||text(st.execution_gate?.blocked_reason),failed:failure,event:fa}
}
function projectFacts(p,s){

 const hasFailure=!!(failure.why||failure.failed||failure.event);

function actionButtons(r,s){

async function sse(res,on,stateMs=180000){
 const reader=res.body.getReader(),decoder=new TextDecoder();let buf='',ended=false,timer;
 const deadline=new Promise((_,rej)=>timer=setTimeout(()=>rej(Error('انقطع انتظار البث؛ راجع سجل المصنع قبل تكرار الطلب.')),stateMs));
 try{while(!ended){const {done,value}=await Promise.race([reader.read(),deadline]);buf+=decoder.decode(value,{stream:!done});let m;
  while((m=/\r?\n\r?\n/.exec(buf))){const event=buf.slice(0,m.index);buf=buf.slice(m.index+m[0].length);const line=event.split(/\r?\n/).filter(s=>s.startsWith('data:')).map(s=>s.slice(5).trimStart()).join('\n');if(!line)continue;let e;try{e=JSON.parse(line)}catch{continue}if(on(e)===false){ended=true;break}}
  if(done)break
 }}finally{clearTimeout(timer);reader.cancel().catch(()=>{})}
 return ended
}

  const g=gatesOf(d.state).find(g=>id(g.id)===id(gid)), yes=v==='yes';

  confirmAction(yes?'اعتمد القرار':'ارفض القرار',yes?'يسجل المصنع القرار وقد يستأنف العمل أو يطلب خطة مراجعة بحسب نوع الطلب.':'رفض البوابة يوقف المشروع وفق عقد المصنع.',()=>post(apiP(p)+'/gates/'+id(gid),{approved:yes},'سُجل قرار المالك في المصنع.'));return

 const spec={

  resume:['استأنف التشغيل','يطلب استئناف العمل من حالة المصنع المحفوظة.','/resume','سُجل طلب الاستئناف.',acts.includes('resume')&&st==='PAUSED'],

 }[kind];
 if(spec?.[4]&&d.state&&!d.errors.state&&(d.runtime&&!d.errors.runtime||['approve','verify'].includes(kind)))confirmAction(spec[0],spec[1],()=>post(apiP(p)+spec[2],kind==='approve'?{approved:true}:{},spec[3]));
}
document.addEventListener('click',e=>{
 if(e.target.closest('.skip')){e.preventDefault();el('main')?.focus();return}
 const a=e.target.closest('[data-route]');if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey&&e.button===0){e.preventDefault();closeModal();S.art=null;S.query='';const h=a.getAttribute('href');if(h===location.hash){fresh();render()}else location.hash=h;return}
 const b=e.target.closest('[data-act]');if(b&&!b.disabled)eventAction(b.dataset.act)
});
document.addEventListener('input',e=>{
 const x=e.target;
 if(x.id==='goal')S.drafts.goal=x.value;
 if(x.id==='message')S.drafts['chat:'+S.route.p+':'+S.route.c]=x.value;
 if(x.id==='search-query')search(x.value);
 if(x.id==='artifact-query'){S.query=x.value;el('artifact-list').innerHTML=artifactList(S.route,arr(slot(S.route.p).artifacts?.artifacts),x.value)}
});
document.addEventListener('submit',e=>{
 const f=e.target;if(!['project-form','name-form','chat-form'].includes(f.id))return;e.preventDefault();if(S.busy)return;
 if(f.id==='project-form'){
  const goal=el('goal').value.trim();if(goal.length<3)return;S.drafts.goal=goal;
  modal('راجع هدف المشروع','<p class="callout" dir="auto">'+E(goal)+'</p><form id="name-form"><label class="field"><span>اسم المشروع</span><input id="project-name" maxlength="200" required value="'+E(goal.slice(0,65))+'"></label><p id="modal-error" class="small" hidden role="alert"></p><div class="actions"><button type="submit" class="btn primary">أنشئ المسودة</button>'+B('عدّل الهدف','modal-close','','quiet')+'</div></form>');return
 }
 if(f.id==='name-form'){const name=el('project-name').value.trim();if(name&&S.drafts.goal)create(S.drafts.goal,name);return}
 const msg=el('message').value.trim();if(msg)sendChat(S.route,msg)
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();eventAction('search')}if(e.key==='Escape'&&!el('dialog').open&&(S.art||S.route.panel))eventAction('close-inspect')});
el('dialog').addEventListener('close',()=>{confirmation=null;if(returnFocus?.isConnected)returnFocus.focus()});
window.addEventListener('hashchange',activate);
try{if(localStorage.getItem('aes-live-workspace-theme')==='light')document.documentElement.dataset.theme='light'}catch{}
activate();sidebarData().then(()=>{if(S.route.v==='decisions'&&!S.route.p)freshDecisions()});
function freshDecisions(){arr(S.projects).filter(x=>['AWAITING_OWNER_APPROVAL','BLOCKED','COMPLETED'].includes(x.status)).slice(0,35).forEach(x=>readPart(id(x.id),'state'))}
setInterval(()=>{if(!document.hidden&&S.route?.p){const r=S.route;core(r.p);const running=['RUNNING','PLANNING','REVISING'].includes(rawStatus(slot(r.p)));if(running&&r.v==='run'){readPart(r.p,'steps');readPart(r.p,'executions')}if(running&&r.v==='events')readPart(r.p,'history');if(running&&r.v==='outputs')readPart(r.p,'artifacts')}},7000);
