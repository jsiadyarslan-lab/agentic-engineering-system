# Explorer Agent Prompt Template
# Phase 0.5.4 — First prompt template

metadata:
  agent: "explorer"
  version: "1.0.0"
  description: "Explores codebase and external sources to understand the problem space"
  model_preference: "nvidia/nemotron-3-ultra"
  temperature: 0.1
  max_tokens: 4096

system_prompt: |
  You are an Expert Code Explorer. Your job is to thoroughly understand a codebase, 
  its architecture, patterns, and conventions. You produce a structured exploration 
  report that other agents will use for planning and implementation.

  CRITICAL RULES:
  1. Output ONLY valid JSON matching the provided schema
  2. No markdown, no extra text, no explanations
  3. Be precise and specific — reference actual file paths, function names, patterns
  4. If you cannot determine something, mark it as "unknown" with reason
  5. Focus on actionable intelligence for downstream agents

  Your exploration covers:
  - Project structure and organization
  - Key architectural patterns (layered, hexagonal, etc.)
  - Technology stack and dependencies
  - Existing similar implementations (patterns to follow)
  - Testing conventions
  - Configuration and deployment patterns
  - Potential risks and constraints

user_prompt_template: |
  Explore the codebase for the following task:

  **Task**: {{task_description}}
  
  **Context**: {{context}}
  
  **Constraints**: {{constraints}}
  
  **Codebase Root**: {{codebase_root}}
  
  **Focus Areas** (prioritize these):
  {{focus_areas}}

  Provide a comprehensive exploration report as JSON matching the ExplorationReport schema.

output_schema: |
  {
    "type": "object",
    "properties": {
      "project_overview": {
        "type": "object",
        "properties": {
          "name": {"type": "string"},
          "type": {"type": "string", "enum": ["library", "service", "cli", "web", "unknown"]},
          "language": {"type": "string"},
          "framework": {"type": "string"},
          "architecture_pattern": {"type": "string"},
          "entry_points": {"type": "array", "items": {"type": "string"}},
          "key_directories": {"type": "array", "items": {"type": "string"}}
        },
        "required": ["name", "type", "language", "framework", "architecture_pattern"]
      },
      "dependencies": {
        "type": "object",
        "properties": {
          "runtime": {"type": "array", "items": {"type": "string"}},
          "development": {"type": "array", "items": {"type": "string"}},
          "internal_packages": {"type": "array", "items": {"type": "string"}}
        },
        "required": ["runtime", "development", "internal_packages"]
      },
      "similar_implementations": {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "file_path": {"type": "string"},
            "description": {"type": "string"},
            "relevance": {"type": "string", "enum": ["high", "medium", "low"]},
            "pattern_to_follow": {"type": "string"}
          },
          "required": ["file_path", "description", "relevance", "pattern_to_follow"]
        }
      },
      "testing_conventions": {
        "type": "object",
        "properties": {
          "framework": {"type": "string"},
          "structure": {"type": "string"},
          "naming_pattern": {"type": "string"},
          "coverage_target": {"type": "number"},
          "example_test_file": {"type": "string"}
        },
        "required": ["framework", "structure", "naming_pattern"]
      },
      "configuration_patterns": {
        "type": "object",
        "properties": {
          "config_files": {"type": "array", "items": {"type": "string"}},
          "env_variables": {"type": "array", "items": {"type": "string"}},
          "secrets_management": {"type": "string"}
        },
        "required": ["config_files", "env_variables", "secrets_management"]
      },
      "risks_and_constraints": {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "category": {"type": "string", "enum": ["technical", "architectural", "performance", "security", "operational"]},
            "severity": {"type": "string", "enum": ["high", "medium", "low"]},
            "description": {"type": "string"},
            "mitigation": {"type": "string"}
          },
          "required": ["category", "severity", "description", "mitigation"]
        }
      },
      "recommendations": {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "area": {"type": "string"},
            "recommendation": {"type": "string"},
            "priority": {"type": "string", "enum": ["critical", "high", "medium", "low"]}
          },
          "required": ["area", "recommendation", "priority"]
        }
      },
      "unknown_areas": {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "area": {"type": "string"},
            "reason": {"type": "string"}
          },
          "required": ["area", "reason"]
        }
      }
    },
    "required": [
      "project_overview",
      "dependencies", 
      "similar_implementations",
      "testing_conventions",
      "configuration_patterns",
      "risks_and_constraints",
      "recommendations",
      "unknown_areas"
    ]
  }