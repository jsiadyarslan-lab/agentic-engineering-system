[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-v2"
version = "2.1.0"
description = "Agent Hub v2 — منصة تنفيذ: دورة الأدوار الخمسة + حزم الموجّه الثلاث + محرك الأوامر التنفيذية EOE (منح موقعة، تنفيذ معزول، دفع بموافقة أحادية)"
readme = "README.md"
requires-python = ">=3.10"
# الست الإنتاجية فقط — بأمر التأسيس. لا pandas/numpy/matplotlib/yfinance
# الآن؛ تأتي مع الأدوات المضمّنة في أمر لاحق.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pytest وحده — تبعية تطوير لا إنتاج (الأمر حدّد ست تبعيات إنتاجية).
test = ["pytest>=7.2", "httpx>=0.26"]
# أدوات PDF العربية (الأمر السادس §4): reportlab + reshaper + bidi + pypdf.
# مثبتة في requirements-full.txt لدى v1 — هنا extra مستقل بنفس الحزم.
pdf = [
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pypdf>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
