[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-v2"
version = "2.0.0a1"
description = "Agent Hub v2 — نظام وكلاء حقيقي: محادثة بسيطة + تنفيذ معزول موثوق + حالات صادقة (تأسيس)"
readme = "README.md"
requires-python = ">=3.10"
# الست الإنتاجية فقط — بأمر التأسيس. لا pandas/numpy/matplotlib/yfinance
# الآن؛ تأتي مع الأدوات المضمّنة في أمر لاحق.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pytest وحده — تبعية تطوير لا إنتاج (الأمر حدّد ست تبعيات إنتاجية).
test = ["pytest>=7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
