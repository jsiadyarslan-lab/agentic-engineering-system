[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-system"
version = "4.0.0"
description = "Agentic Engineering System — نظام هندسة ذاتي بإشراف المالك: مشروع دائم ← خطة رئيسية ← حلقة ذاتية (تنفيذ/اختبار/مراجعة/تدقيق/تحكيم) ← أدلة ← بوابات مالك ← تحقق نهائي؛ مع إدارة مزودين وتكوينات كاملة من الواجهة"
readme = "README.md"
requires-python = ">=3.10"
# الست الإنتاجية فقط — بأمر التأسيس. لا pandas/numpy/matplotlib/yfinance
# الآن؛ تأتي مع الأدوات المضمّنة في أمر لاحق.
dependencies = [
    # (AES-FACTORY-RELEASE-READINESS-002 §2) حد أدنى مُثبت لا نظري:
    # fastapi 0.128/starlette 0.50 (كانت ضمن >=0.110) تُقفل بث SSE
    # كاملًا في مسار الاعتماد الحي (BaseHTTPMiddleware + StreamingResponse
    # + TestClient: رؤوس الاستجابة لا تصل — 102ث صمتًا ثم انهيار الدورة)
    # — أُثبت تشخيصيًا، والمثبت على 0.162.7/starlette 1.10 يعمل.
    "fastapi>=0.162",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# (RR002 §2) تبعيات الاختبار = القدرات المُعلنة التي تختبرها المجموعة
# الموثوقة: قلب الاختبار + PDF العربية (reportlab/reshaper/bidi/pypdf).
# قبل التوحيد كان tests/core/test_stop_mission.py يتخطى صامتًا
# (importorskip pypdf) — قدرة معلنة بلا اختبار فعلي في CI. الوحدة
# تُثبت .[test] فحسب (سطر CI غير قابل للتعديل بهذا الرمز — بلا نطاق
# workflow)؛ لذا تدخل حزم PDF هنا مباشرة ليغطيها التثبيت نفسه.
test = [
    "pytest>=7.2",
    "httpx>=0.26",
    "websockets>=12.0",
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pypdf>=4.0",
]
# أدوات PDF العربية (الأمر السادس §4): reportlab + reshaper + bidi + pypdf.
# مثبتة في requirements-full.txt لدى v1 — هنا extra مستقل بنفس الحزم.
pdf = [
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pypdf>=4.0",
]
# (013 §13-§14) متصفح ميكانيكي حقيقي — Playwright + Chromium.
# اختيارية عمدًا: غيابها = القدرة NOT_READY بسببها الحرفي (لا تزييف)؛
# التثبيت: pip install '.[browser]' ثم python -m playwright install chromium
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
