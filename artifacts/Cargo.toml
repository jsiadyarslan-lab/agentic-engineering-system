[package]
name = "artifacts"
version = "0.1.0"
edition = "2024"
description = "Content-addressed artifact store with provenance"

[dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

# Crypto
sha2 = { workspace = true }
blake3 = { workspace = true }
sha1 = "0.10"
hex = "0.4"

# Sigstore
sigstore = { version = "0.12", features = ["sign", "verify", "rekor", "cosign", "fulcio", "rekor"] }

# Time
chrono = { workspace = true, features = ["serde"] }

# Database
sqlx = { workspace = true }
rusqlite = { workspace = true }

# Paths
walkdir = "2"

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }