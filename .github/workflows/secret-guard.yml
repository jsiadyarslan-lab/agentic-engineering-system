# AES-P0-CONTAINMENT-1113: guard against hardcoded credentials entering the repo.
# Runs on EVERY push and pull_request — including main (unlike the legacy CI).
name: secret-guard
on:
  push:
  pull_request:
jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan for hardcoded credentials
        run: python3 scripts/ops/secret_guard.py
