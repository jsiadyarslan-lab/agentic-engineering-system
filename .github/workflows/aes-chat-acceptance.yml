name: AES Chat Acceptance (isolated)

on:
  pull_request:
  workflow_dispatch:

# One active acceptance run per PR; no duplicate push-triggered jobs.
concurrency:
  group: aes-chat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chat-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]' pytest-asyncio pytest-timeout
      - name: Check JavaScript syntax and browser contract
        run: |
          node tests/api/factory_v3_smoke.cjs
      - name: Python API chat and streaming regressions
        run: |
          python -m pytest -q --no-header --timeout=50 \
            tests/api/test_factory_v3_live.py \
            tests/api/test_factory_project_chat_001.py \
            tests/api/test_chat_stream.py \
            tests/api/test_chat_error_handler_p1.py \
            tests/api/test_chat_isolation_0135.py \
            tests/api/test_sse_keepalive_aes.py \
            tests/api/test_conversation_identity.py \
            tests/api/test_aes_v4_workspace_contract.py \
            tests/workflow/test_execution_gate_consistency_001.py \
            tests/workflow/test_search_requirement_contract.py \
            tests/workflow/test_evidence_commit_001.py
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/aes-browser" --no-save --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/aes-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chat, Arabic phase layout and responsive scrolling
        env:
          NODE_PATH: ${{ runner.temp }}/aes-browser/node_modules
          AES_TEST_SCREENSHOT: ${{ runner.temp }}/aes-workspace-desktop.png
        run: |
          node tests/api/factory_v3_readability_browser.cjs
          node tests/api/factory_v3_runs_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-workspace-desktop
          path: ${{ runner.temp }}/aes-workspace-desktop.png
          if-no-files-found: ignore
