name: AES trusted suite

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap (isolation substrate for the runner)
        # AES-ORACLE-LIVE-REPAIR-001 §4: ركيزة العزل على العدّاء — بدونها
        # يمنع المصنع fail-closed الدورات الحية (8 فشل موثقة في التشغيل الأول).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version

      - name: Install project + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' pytest-asyncio pytest-timeout

      - name: Trusted suite
        # المجموعة الموثوقة: الجاهزية + النواة + مسار API الحي + تراجعات
        # AES-EXP-03 + فحوصات أمان R1-1113 (tests/security: فاحص الأسرار
        # وسلامة سكربتات النشر ومسار التوكن).
        # AES-ORACLE-LIVE-REPAIR-001 §4: shell bash = -eo pipefail —
        # لا يمكن لـ tail إخفاء رمز فشل pytest بعد اليوم؛ الحكم المعروض
        # يطابق نتيجة الاختبارات الفعلية أو لا يعرض شيئاً.
        # R1-1113 §9: أُزيل tail -40 (كان يقصع قائمة الفشل الكاملة —
        # 6 من 22 فشلًا لم تكن تظهر في السجلات)؛ المخرج الكامل يُطبع الآن
        # و pipefail يضمن رمز الخروج.
        shell: bash
        run: |
          set -o pipefail
          pytest tests/readiness tests/core tests/api tests/security \
            --timeout=150 -q --no-header \
            -p no:cacheprovider 2>&1
