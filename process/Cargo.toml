[package]
name = "process"
version = "0.1.0"
edition = "2024"
description = "Cross-platform process spawn, monitor, and management"

[dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"
cfg-if = "1.0"

# Platform-agnostic - include all, use cfg_if in code
windows = { workspace = true }
job-objects = { path = "../job-objects" }
nix = { workspace = true }
libc = { workspace = true }
objc = { workspace = true }
seatbelt = { path = "../seatbelt" }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }
