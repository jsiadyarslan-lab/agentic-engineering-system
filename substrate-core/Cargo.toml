[package]
name = "substrate-core"
version = "0.1.0"
edition = "2024"
description = "Abstract Substrate trait and core types for cross-platform execution"

[dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
uuid = { workspace = true, features = ["v4", "serde", "v1"] }
bytes = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

[dev-dependencies]
proptest = { workspace = true }
tokio-test = "0.4"